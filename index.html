<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Daily Polyglot Drill</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #f3f3f3;
         max-width: 680px; margin: 0 auto; padding: 14px 14px 36px; }
  .meta { font-size: 0.82rem; color: #8e8e93; text-align: center; margin-bottom: 10px; }
  .day-bar { display: flex; align-items: center; justify-content: center; gap: 8px;
             flex-wrap: wrap; margin-bottom: 12px; }
  .day-bar label { font-size: 0.86rem; color: #aaa; font-weight: 600; }
  .day-bar select { background: #1d1d1f; color: #fff; border: 1px solid #3a3a3d;
                    border-radius: 10px; padding: 7px 10px; font-size: 0.9rem;
                    max-width: 100%; }
  .today-btn { background: #1e3a5f; color: #fff; border: 1px solid #60a5fa;
               border-radius: 10px; padding: 7px 11px; font-size: 0.84rem;
               font-weight: 600; cursor: pointer; }
  .today-btn[hidden] { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 10px; margin-bottom: 14px; }
  .tab { background: #1d1d1f; color: #ccc; border: 1px solid #333; border-radius: 12px;
         padding: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: center; }
  .tab span { display: block; font-size: 0.76rem; font-weight: 400; color: #8e8e93; margin-top: 2px; }
  .tab.active { background: #1e3a5f; border-color: #60a5fa; color: #fff; }
  .tab.active span { color: #bfdbfe; }
  .card { background: #1a1a1d; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .counter { font-size: 0.8rem; color: #8e8e93; text-align: center; margin-bottom: 10px; }
  .lang-row { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px;
              border-radius: 10px; border: 1px solid transparent; margin-bottom: 8px;
              background: #222226; transition: background 0.12s, border-color 0.12s; }
  .lang-row:last-child { margin-bottom: 0; }
  .lang-row.speaking { background: #1e3a5f; border-color: #60a5fa; }
  .lang-row.hidden .lang-text { opacity: 0; }
  .lang-row.skipped { display: none; }
  .badge { flex-shrink: 0; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
           padding: 3px 6px; border-radius: 6px; background: #333; color: #bbb; width: 34px;
           text-align: center; }
  .lang-row.speaking .badge { background: #60a5fa; color: #0a192f; }
  .lang-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lang-text { font-size: 1.12rem; line-height: 1.38; font-weight: 500; color: #f3f3f3;
               transition: opacity 0.12s ease; }
  .pinyin-text { font-size: 0.88rem; line-height: 1.32; font-weight: 400; color: #a1a1aa;
                 transition: opacity 0.12s ease; }
  #row-fr .lang-text { color: #93c5fd; }
  #row-es .lang-text { color: #fde68a; }
  #row-el .lang-text { color: #86efac; }
  #row-zh { align-items: flex-start; }
  #row-zh .badge { margin-top: 32px; }
  #row-zh .lang-text { color: #fca5a5; font-size: 4.48rem; line-height: 1.22; overflow-wrap: anywhere; }
  .lang-row.speaking .lang-text { color: #ffffff; font-weight: 600; }
  .lang-row.speaking .pinyin-text { color: #dbeafe; }
  .lang-row.hidden .pinyin-text { opacity: 0; }
  .pinyin-hidden .pinyin-text { display: none; }
  .play-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px;
              border: 1px solid #3b82f6; background: #1e3a5f; color: #fff;
              font-size: 1rem; font-weight: 600; cursor: pointer; }
  .play-btn.playing { background: #26262a; border-color: #555; color: #e5e7eb; }
  audio { width: 100%; margin-bottom: 12px; }
  .controls { display: flex; gap: 10px 16px; justify-content: center; align-items: center;
              flex-wrap: wrap; font-size: 0.9rem; color: #ccc; margin-bottom: 16px; }
  .controls label { display: inline-flex; align-items: center; gap: 6px; }
  .controls label[hidden] { display: none; }
  .controls label.disabled { opacity: 0.45; }
  select { background: #222; color: #fff; border: 1px solid #444;
           border-radius: 6px; padding: 4px 8px; font-size: 0.9rem; }
  select:disabled { opacity: 0.45; }
  .baked-note { font-size: 0.78rem; color: #93c5fd; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { padding: 11px 13px; border-radius: 10px; background: #18181a;
          cursor: pointer; font-size: 0.92rem; color: #aaa; }
  .item.active { background: #1e3a5f; color: #fff; }
</style>
</head>
<body>
  <div id="headerMeta" class="meta">2026-11-27 · Day 1 (Cycle 1) · 20 polyglot (EN → FR → MX → EL → ZH) + 100 ZH verbs (EN → ZH)</div>

  <div class="day-bar">
    <label for="daySelect">Day:</label>
    <select id="daySelect" aria-label="Select drill day (last 7 days)"></select>
    <button id="todayBtn" class="today-btn" type="button" hidden>Current Day</button>
  </div>

  <div id="tabs" class="tabs"></div>

  <div class="card">
    <div id="counter" class="counter">Tap Play to start</div>
    <div id="row-en" class="lang-row"><span class="badge">EN</span><span id="txt-en" class="lang-text">Ready</span></div>
    <div id="row-fr" class="lang-row"><span class="badge">FR</span><span id="txt-fr" class="lang-text"></span></div>
    <div id="row-es" class="lang-row"><span class="badge">MX</span><span id="txt-es" class="lang-text"></span></div>
    <div id="row-el" class="lang-row"><span class="badge">EL</span><span id="txt-el" class="lang-text"></span></div>
    <div id="row-zh" class="lang-row"><span class="badge">ZH</span><div class="lang-content"><span id="txt-zh" class="lang-text"></span><span id="txt-pinyin" class="pinyin-text"></span></div></div>
  </div>

  <button id="playPauseBtn" class="play-btn" type="button">▶ Play</button>
  <audio id="audio" controls loop preload="auto"></audio>

  <div class="controls">
    <label>Repeat set:
      <select id="repeatCount" aria-label="Repeat full sentence set">
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="inf">∞ (Loop 1)</option>
      </select>
    </label>
    <label>Repeat translation:
      <select id="transRepeatCount" aria-label="Repeat each translation (excludes English)">
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
      </select>
    </label>
    <span id="bakedNote" class="baked-note"></span>
    <label>Speed:
      <select id="speed">
        <option value="0.8">0.8x</option>
        <option value="0.9">0.9x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.15">1.15x</option>
        <option value="1.25">1.25x</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="extraPauseToggle"> Extra pause
      <select id="extraPauseSec" aria-label="Extra pause seconds">
        <option value="1">+1s</option>
        <option value="2" selected>+2s</option>
        <option value="3">+3s</option>
        <option value="4">+4s</option>
        <option value="5">+5s</option>
      </select>
    </label>
    <label id="enBeforeEachLabel"><input type="checkbox" id="enBeforeEach"> English before each language</label>
    <label id="skipZhLabel"><input type="checkbox" id="skipZh"> Skip Mandarin</label>
    <label id="pinyinLabel"><input type="checkbox" id="showPinyin" checked> Show Pinyin</label>
    <label><input type="checkbox" id="revealMode"> Reveal each language as it speaks</label>
  </div>

  <div id="list" class="list"></div>

mo asma o enfermedad pulmonar obstructiva crónica, y ayudándolos a manejar esos problemas en el día a día.", "el": "Περνάω μεγάλο μέρος της εβδομάδας στο ιατρείο, όπου βλέπω ασθενείς με χρόνια αναπνευστικά προβλήματα, όπως άσθμα ή χρόνια αποφρακτική πνευμονοπάθεια, και τους βοηθάω να τα διαχειρίζονται στην καθημερινότητά τους.", "zh": "我一周里有很多时间是在门诊，看那些有慢性呼吸问题的病人，比如哮喘，慢阻肺，帮他们把日常的病情控制好。", "pinyin": "Wǒ yì zhōu lǐ yǒu hěn duō shíjiān shì zài ménzhěn, kàn nàxiē yǒu mànxìng hūxī wèntí de bìngrén, bǐrú xiàochuǎn, mànzǔfèi, bāng tāmen bǎ rìcháng de bìngqíng kòngzhì hǎo.", "start": 194.03, "en_start": 194.53, "en_end": 203.48, "fr_start": 204.48, "fr_end": 216.52, "es_start": 217.52, "es_end": 229.8, "el_start": 230.8, "el_end": 244.32, "el_repeat_at": 244.67, "repeat_at": 255.51, "end": 255.66, "segments": [{"key": "en", "start": 194.53, "end": 203.48, "prev_end": 194.03, "next": 204.48, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 204.48, "end": 216.52, "prev_end": 203.48, "next": 217.52, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 217.52, "end": 229.8, "prev_end": 216.52, "next": 230.8, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 230.8, "end": 244.32, "prev_end": 229.8, "next": 245.32, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 245.32, "end": 255.16, "prev_end": 244.32, "next": 255.66, "baked_pass": 1, "baked_passes": 1}], "zh_start": 245.32, "zh_end": 255.16}, {"sent_idx": 7, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "On the hospital side, I also take care of critically ill patients in the intensive care unit.", "fr": "À l’hôpital, je m’occupe aussi de patients en état critique dans le service de réanimation.", "es": "En el hospital también atiendo a pacientes en estado crítico en la unidad de terapia intensiva.", "el": "Στο νοσοκομείο φροντίζω επίσης ασθενείς που είναι σε κρίσιμη κατάσταση στη μονάδα εντατικής θεραπείας.", "zh": "在医院这边，我也会在重症监护室照顾病情危重的病人。", "pinyin": "Zài yīyuàn zhè biān, wǒ yě huì zài zhòngzhèng jiānhùshì zhàogù bìngqíng wēizhòng de bìngrén.", "start": 255.66, "en_start": 256.16, "en_end": 261.16, "fr_start": 262.16, "fr_end": 267.48, "es_start": 268.48, "es_end": 273.54, "el_start": 274.54, "el_end": 280.66, "el_repeat_at": 281.01, "repeat_at": 286.65, "end": 286.8, "segments": [{"key": "en", "start": 256.16, "end": 261.16, "prev_end": 255.66, "next": 262.16, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 262.16, "end": 267.48, "prev_end": 261.16, "next": 268.48, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 268.48, "end": 273.54, "prev_end": 267.48, "next": 274.54, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 274.54, "end": 280.66, "prev_end": 273.54, "next": 281.66, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 281.66, "end": 286.3, "prev_end": 280.66, "next": 286.8, "baked_pass": 1, "baked_passes": 1}], "zh_start": 281.66, "zh_end": 286.3}, {"sent_idx": 8, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "It was a long path getting here: medical school in Brazil, internal medicine residency at the University of Connecticut, and then a Pulmonary and Critical Care fellowship in Los Angeles.", "fr": "Le parcours a été long : j’ai fait mes études de médecine au Brésil, mon internat en médecine interne à l’université du Connecticut, puis une formation spécialisée en pneumologie et en réanimation à Los Angeles.", "es": "Fue un camino largo: estudié medicina en Brasil, hice la residencia en medicina interna en la Universidad de Connecticut y después me especialicé en neumología y medicina crítica en Los Ángeles.", "el": "Μου πήρε χρόνια να φτάσω ως εδώ. Σπούδασα ιατρική στη Βραζιλία, έκανα ειδικότητα στην παθολογία στο Πανεπιστήμιο του Κονέκτικατ και μετά εξειδικεύτηκα στην πνευμονολογία και την εντατική θεραπεία στο Λος Άντζελες.", "zh": "这一路走来挺长的，在巴西念医学院，在康涅狄格大学做内科住院医，然后又在洛杉矶做呼吸与危重症的专科培训。", "pinyin": "Zhè yí lù zǒulái tǐng cháng de, zài Bāxī niàn yīxuéyuàn, zài Kāngnièdígé Dàxué zuò nèikē zhùyuànyī, ránhòu yòu zài Luòshānjī zuò hūxī yǔ wēizhòngzhèng de zhuānkē péixùn.", "start": 286.8, "en_start": 287.3, "en_end": 297.14, "fr_start": 298.14, "fr_end": 310.34, "es_start": 311.34, "es_end": 322.41, "el_start": 323.41, "el_end": 336.93, "el_repeat_at": 337.28, "repeat_at": 349.96, "end": 350.11, "segments": [{"key": "en", "start": 287.3, "end": 297.14, "prev_end": 286.8, "next": 298.14, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 298.14, "end": 310.34, "prev_end": 297.14, "next": 311.34, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 311.34, "end": 322.41, "prev_end": 310.34, "next": 323.41, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 323.41, "end": 336.93, "prev_end": 322.41, "next": 337.93, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 337.93, "end": 349.61, "prev_end": 336.93, "next": 350.11, "baked_pass": 1, "baked_passes": 1}], "zh_start": 337.93, "zh_end": 349.61}, {"sent_idx": 9, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "It can definitely be demanding, but I like the mix of solving tough problems and working closely with people.", "fr": "C’est un métier qui peut être assez prenant, c’est sûr, mais j’aime le fait de pouvoir à la fois résoudre des problèmes compliqués et travailler au plus près des gens.", "es": "Sí puede ser pesado, pero me gusta que puedo resolver problemas complicados y al mismo tiempo trabajar de cerca con la gente.", "el": "Σίγουρα μπορεί να είναι απαιτητική δουλειά, αλλά μου αρέσει που λύνω δύσκολα προβλήματα και ταυτόχρονα δουλεύω στενά με ανθρώπους.", "zh": "这份工作是挺费心费力的，但我喜欢既能解决难题，又能跟人密切打交道的那种感觉。", "pinyin": "Zhè fèn gōngzuò shì tǐng fèixīn fèilì de, dàn wǒ xǐhuan jì néng jiějué nántí, yòu néng gēn rén mìqiè dǎ jiāodào de nà zhǒng gǎnjué.", "start": 350.11, "en_start": 350.61, "en_end": 356.73, "fr_start": 357.73, "fr_end": 366.57, "es_start": 367.57, "es_end": 374.18, "el_start": 375.18, "el_end": 383.06, "el_repeat_at": 383.41, "repeat_at": 391.85, "end": 392.0, "segments": [{"key": "en", "start": 350.61, "end": 356.73, "prev_end": 350.11, "next": 357.73, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 357.73, "end": 366.57, "prev_end": 356.73, "next": 367.57, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 367.57, "end": 374.18, "prev_end": 366.57, "next": 375.18, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 375.18, "end": 383.06, "prev_end": 374.18, "next": 384.06, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 384.06, "end": 391.5, "prev_end": 383.06, "next": 392.0, "baked_pass": 1, "baked_passes": 1}], "zh_start": 384.06, "zh_end": 391.5}]}, {"id": 2, "label": "Batch 2", "range": "#11–20 (10 sentences)", "languages": ["en", "fr", "es", "el", "zh"], "sentenceCount": 10, "audioSrc": "days/2026-11-27/batch_2.mp3?v=1795832336", "cues": [{"sent_idx": 0, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "What kind of work do you do?", "fr": "Tu fais quoi comme boulot ?", "es": "¿A qué te dedicas?", "el": "Τι δουλειά κάνεις;", "zh": "你是做什么工作的？", "pinyin": "Nǐ shì zuò shénme gōngzuò de?", "start": 0.0, "en_start": 0.5, "en_end": 2.05, "fr_start": 3.05, "fr_end": 4.48, "es_start": 5.48, "es_end": 6.68, "el_start": 7.68, "el_end": 9.52, "el_repeat_at": 9.87, "repeat_at": 12.15, "end": 12.3, "segments": [{"key": "en", "start": 0.5, "end": 2.05, "prev_end": 0.0, "next": 3.05, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 3.05, "end": 4.48, "prev_end": 2.05, "next": 5.48, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 5.48, "end": 6.68, "prev_end": 4.48, "next": 7.68, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 7.68, "end": 9.52, "prev_end": 6.68, "next": 10.52, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 10.52, "end": 11.8, "prev_end": 9.52, "next": 12.3, "baked_pass": 1, "baked_passes": 1}], "zh_start": 10.52, "zh_end": 11.8}, {"sent_idx": 1, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "Language learning is easily my biggest hobby outside of family and work.", "fr": "En dehors de la famille et du boulot, ma plus grande passion, c’est de loin d’apprendre des langues.", "es": "Aparte de la familia y el trabajo, aprender idiomas es, por mucho, mi pasatiempo favorito.", "el": "Πέρα από την οικογένεια και τη δουλειά, το αγαπημένο μου χόμπι με διαφορά είναι να μαθαίνω γλώσσες.", "zh": "除了家庭和工作，学语言绝对是我最大的爱好。", "pinyin": "Chúle jiātíng hé gōngzuò, xué yǔyán juéduì shì wǒ zuì dà de àihào.", "start": 12.3, "en_start": 12.8, "en_end": 16.82, "fr_start": 17.82, "fr_end": 23.29, "es_start": 24.29, "es_end": 29.77, "el_start": 30.77, "el_end": 36.85, "el_repeat_at": 37.2, "repeat_at": 42.52, "end": 42.67, "segments": [{"key": "en", "start": 12.8, "end": 16.82, "prev_end": 12.3, "next": 17.82, "baked_pass": 1, "baked_passes": 1}, {"key": "fr", "start": 17.82, "end": 23.29, "prev_end": 16.82, "next": 24.29, "baked_pass": 1, "baked_passes": 1}, {"key": "es", "start": 24.29, "end": 29.77, "prev_end": 23.29, "next": 30.77, "baked_pass": 1, "baked_passes": 1}, {"key": "el", "start": 30.77, "end": 36.85, "prev_end": 29.77, "next": 37.85, "baked_pass": 1, "baked_passes": 1}, {"key": "zh", "start": 37.85, "end": 42.17, "prev_end": 36.85, "next": 42.67, "baked_pass": 1, "baked_passes": 1}], "zh_start": 37.85, "zh_end": 42.17}, {"sent_idx": 2, "baked_pass": 1, "baked_passes": 1, "baked_trans_passes": 1, "en": "I grew up speaking Portuguese in Brazil, and I learned English as a kid, so I've been fluent in both for a long time.", "fr": "J’ai grandi au Brésil en parlant portugais, et j’ai appris l’anglais quand j’étais petit. Du coup, ça fait longtemps que je parle couramment les deux.", "es": "Crecí hablando portugués en Brasil y aprendí inglés de niño, así que hablo los dos con fluidez desde hace mucho.", "el": "Μεγάλωσα στη Βραζιλία μιλώντας πορτογαλικά και έμαθα αγγλικά από μικρός, οπότε μιλάω άνετα και τ is good for us.", "fr": "C’est pour ça que faire de l’exercice, ça nous fait du bien.", "es": "Por eso nos hace bien hacer ejercicio.", "el": "Γι’ αυτό μας κάνει καλό η άσκηση.", "zh": "所以运动对我们有好处。", "pinyin": "Suǒyǐ yùndòng duì wǒmen yǒu hǎochù.", "start": 113.73, "en_end": 115.91, "fr_start": 116.91, "fr_end": 120.26, "es_start": 121.26, "es_end": 123.55, "el_start": 124.55, "el_end": 127.23, "zh_start": 128.23, "zh_end": 130.83, "el_repeat_at": 128.11, "repeat_at": 131.71, "end": 131.83}, {"sent_idx": 5, "baked_pass": 1, "baked_passes": 1, "en": "It helps the heart stay strong!", "fr": "Ça aide le cœur à rester en forme !", "es": "¡Ayuda a que el corazón se mantenga fuerte!", "el": "Βοηθάει την καρδιά να μείνει δυνατή!", "zh": "它能让心脏保持强壮！", "pinyin": "Tā néng ràng xīnzàng bǎochí qiángzhuàng!", "start": 131.83, "en_end": 133.67, "fr_start": 134.67, "fr_end": 137.07, "es_start": 138.07, "es_end": 140.63, "el_start": 141.63, "el_end": 143.95, "zh_start": 144.95, "zh_end": 147.17, "el_repeat_at": 144.83, "repeat_at": 148.05, "end": 148.17}, {"sent_idx": 6, "baked_pass": 1, "baked_passes": 1, "en": "What happens to food after we eat it?", "fr": "Qu’est-ce qui arrive aux aliments une fois qu’on les a mangés ?", "es": "¿Qué pasa con la comida después de que nos la comemos?", "el": "Τι γίνεται με το φαγητό αφού το φάμε;", "zh": "我们吃下去的食物后来会怎么样？", "pinyin": "Wǒmen chī xiàqù de shíwù hòulái huì zěnmeyàng?", "start": 148.17, "en_end": 150.61, "fr_start": 151.61, "fr_end": 154.71, "es_start": 155.71, "es_end": 158.56, "el_start": 159.56, "el_end": 162.24, "zh_start": 163.24, "zh_end": 165.73, "el_repeat_at": 163.12, "repeat_at": 166.61, "end": 166.73}, {"sent_idx": 7, "baked_pass": 1, "baked_passes": 1, "en": "The digestive system breaks it down so our bodies can use the nutrients.", "fr": "Le système digestif décompose les aliments pour que notre corps puisse utiliser les nutriments.", "es": "El sistema digestivo descompone la comida para que nuestro cuerpo pueda aprovechar ", "start": 243.55, "en_end": 244.38, "fr_start": 245.38, "fr_end": 246.32, "es_start": 247.32, "es_end": 248.22, "el_start": 249.22, "el_end": 250.58, "zh_start": 251.58, "zh_end": 252.64, "el_repeat_at": 251.46, "repeat_at": 253.52, "end": 253.64}, {"sent_idx": 11, "baked_pass": 1, "baked_passes": 1, "en": "After that, the food moves to the small intestine, where the body absorbs important nutrients.", "fr": "Ensuite, les aliments passent dans l’intestin grêle, où le corps absorbe des nutriments importants.", "es": "Después, la comida pasa al intestino delgado, donde el cuerpo absorbe nutrientes importantes.", "el": "Μετά, η τροφή περνάει στο λεπτό έντερο, όπου το σώμα απορροφά σημαντικά θρεπτικά συστατικά.", "zh": "之后，食物进入小肠，身体在那里吸收重要的营养。", "pinyin": "Zhīhòu, shíwù jìnrù xiǎocháng, shēntǐ zài nàlǐ xīshōu zhòngyào de yíngyǎng.", "start": 253.64, "en_end": 259.11, "fr_start": 260.11, "fr_end": 265.7, "es_start": 266.7, "es_end": 272.25, "el_start": 273.25, "el_end": 279.05, "zh_start": 280.05, "zh_end": 284.49, "el_repeat_at": 279.93, "repeat_at": 285.37, "end": 285.49}, {"sent_idx": 12, "baked_pass": 1, "baked_passes": 1, "en": "What happens to the rest?", "fr": "Et le reste, qu’est-ce qu’il devient ?", "es": "¿Qué pasa con lo demás?", "el": "Και τι γίνεται με ό,τι περισσεύει;", "zh": "那剩下的呢？", "pinyin": "Nà shèngxià de ne?", "start": 285.49, "en_end": 286.9, "fr_start": 287.9, "fr_end": 290.23, "es_start": 291.23, "es_end": 292.6, "el_start": 293.6, "el_end": 296.68, "zh_start": 297.68, "zh_end": 299.0, "el_repeat_at": 297.56, "repeat_at": 299.88, "end": 300.0}, {"sent_idx": 13, "baked_pass": 1, "baked_passes": 1, "en": "Anything the body doesn't need goes to the large intestine and then leaves as waste.", "fr": "Tout ce dont le corps n’a pas besoin passe dans le gros intestin, puis le corps l’évacue sous forme de déchets.", "es": "Lo que el cuerpo no necesita pasa al intestino grueso y luego se elimina como desecho.", "el": "Ό,τι δεν χρειάζεται το σώμα περνάει στο παχύ έντερο και μετά αποβάλλεται ως απόβλητο.", "zh": "身体不需要的东西会进入大肠，最后变成废物排出去。", "pinyin": "Shēntǐ bù xūyào de dōngxi huì jìnrù dàcháng, zuìhòu biànchéng fèiwù pái chūqù.", "start": 300.0, "en_end": 304.66, "fr_start": 305.66, "fr_end": 311.82, "es_start": 312.82, "es_end": 317.78, "el_start": 318.78, "el_end": 326.3, "zh_start": 327.3, "zh_end": 331.98, "el_repeat_at": 327.18, "repeat_at": 332.86, "end": 332.98}, {"sent_idx": 14, "baked_pass": 1, "baked_passes": 1, "en": "Did you know that the nervous system controls everything we do?", "fr": "Tu savais que le système nerveux contrôle tout ce qu’on fait ?", "es": "¿Sabías que el sistema nervioso controla todo lo que hacemos?", "el": "Ήξερες ότι το νευρικό σύστημα ελέγχει όλα όσα κάνουμε;", "zh": "你知道神经系统控制着我们做的每一件事吗？", "pinyin": "Nǐ zhīdào shénjīng xìtǒng kòngzhìzhe wǒmen zuò de měi yí jiàn shì ma?", "start": 332.98, "en_end": 336.23, "fr_start": 337.23, "fr_end": 340.52, "es_start": 341.52, "es_end": 344.9, "el_start": 345.9, "el_end": 349.82, "zh_start": 350.82, "zh_end": 354.39, "el_repeat_at": 350.7, "repeat_at": 355.27, "end": 355.39}, {"sent_idx": 15, "baked_pass": 1, "baked_passes": 1, "en": "How does it work?", "fr": "Comment ça marche ?", "es": "¿Y cómo funciona?", "el": "Πώς λειτουργεί;", "zh": "它是怎么工作的？", "pinyin": "Tā shì zěnme gōngzuò de?", "start": 355.39, "en_end": 356.66, "fr_start": 357.66, "fr_end": 358.87, "es_start": 359.87, "es_end": 361.14, "el_start": 362.14, "el_end": 363.38, "zh_start": 364.38, "zh_end": 366.21, "el_repeat_at": 364.26, "repeat_at": 367.09, "end": 367.21}, {"sent_idx": 16, "baked_pass": 1, "baked_passes": 1, "en": "The brain sends messages through nerves to different parts of the body.", "fr": "Le cerveau envoie des messages à différentes parties du corps en passant par les nerfs.", "es": "El cerebro manda mensajes a distintas partes del cuerpo a través de los nervios.", "el": "Ο εγκέφαλος στέλνει μηνύματα σε διάφορα μέρη του σώματος μέσω των νεύρων.", "zh": "大脑通过神经把信号传到身体的各个部位。", "pinyin": "Dànǎo tōngguò shénjīng bǎ xìnhào chuán dào shēntǐ de gège bùwèi.", "start": 367.21, "en_end": 370.95, "fr_start": 371.95, "fr_end": 376.52, "es_start": 377.52, "es_end": 382.0, "el_start": 383.0, "el_end": 388.76, "zh_start": 389.76, "zh_end": 393.49, "el_repeat_at": 389.64, "repeat_at": 394.37, "end": 394.49}, {"sent_idx": 17, "baked_pass": 1, "baked_passes": 1, "en": "That's how we move, feel, and react to things.", "fr": "C’est comme ça qu’on bouge, qu’on ressent des choses et qu’on y réagit.", "es": "Así es como nos movemos, sentimos cosas y reaccionamos a ellas.", "el": "Έτσι μπορούμε να κινούμαστε, να νιώθουμε και να αντιδρούμε σε ό,τι συμβαίνει γύρω μας.", "zh": "我们就是这样活动、感觉，还有对外界做出反应的。", "pinyin": "Wǒmen jiù shì zhèyàng huódòng, gǎnjué, háiyǒu duì wàijiè zuòchū fǎnyìng de.", "start": 394.49, "en_end": 397.65, "fr_start": 398.65, "fr_end": 402.51, "es_start": 403.51, "es_end": 407.46, "el_start": 408.46, "el_end": 415.66, "zh_start": 416.66, "zh_end": 421.11, "el_repeat_at": 416.54, "repeat_at": 421.99, "end": 422.11}, {"sent_idx": 18, "baked_pass": 1, "baked_passes": 1, "en": "So if I touch something hot, my brain tells my hand to move away?", "fr": "Donc si je touche un truc chaud, mon cerveau dit à ma main de se retirer ?", "es": "Entonces, si toco algo caliente, ¿mi cerebro le dice a mi mano que se quite?", "el": "Δηλαδή αν αγγίξω κάτι καυτό, ο εγκέφαλός μου λέει στο χέρι μου να τραβηχτεί;", "zh": "那如果我碰到烫的东西，大脑就会让我的手缩回来？", "pinyin": "Nà rúguǒ wǒ pèng dào tàng de dōngxi, dànǎo jiù huì ràng wǒ de shǒu suō huílái?", "start": 422.11, "en_end": 426.52, "fr_start": 427.52, "fr_end": 432.08, "es_start": 433.08, "es_end": 437.98, "el_start": 438.98, "el_end": 443.78, "zh_start": 444.78, "zh_end": 449.23, "el_repeat_at": 444.66, "repeat_at": 450.11, "end": 450.23}, {"sent_idx": 19, "baked_pass": 1, "baked_passes": 1, "en": "That's called a reflex.", "fr": "Ça, c’est ce qu’on appelle un réflexe.", "es": "A eso se le llama reflejo.", "el": "Αυτό λέγεται αντανακλαστικό.", "zh": "这就叫反射。", "pinyin": "Zhè jiù jiào fǎnshè.", "start": 450.23, "en_end": 451.67, "fr_start": 452.67, "fr_end": 455.39, "es_start": 456.39, "es_end": 458.2, "el_start": 459.2, "el_end": 461.6, "zh_start": 462.6, "zh_end": 463.95, "el_repeat_at": 462.48, "repeat_at": 464.83, "end": 464.95}]}, {"id": 2, "label": "Batch 2", "range": "#21–40 (20 sentences)", "sentenceCount": 20, "audioSrc": "days/2026-11-25/batch_2.mp3?v=1795666820", "cues": [{"sent_idx": 0, "baked_pass": 1, "baked_passes": 1, "en": "Your body reacts quickly without thinking.", "fr": "Ton corps réagit vite, sans que tu aies besoin d’y penser.", "es": "Tu cuerpo reacciona rápido sin que tengas que pensarlo.", "el": "Το σώμα σου αντιδρά γρήγορα χωρίς να χρειάζεται να το σκεφτείς.", "zh": "你的身体不用思考就能快速反应。", "pinyin": "Nǐ de shēntǐ búyòng sīkǎo jiù néng kuàisù fǎnyìng.", "start": 0.0, "en_end": 2.46, "fr_start": 3.46, "fr_end": 6.79, "es_start": 7.79, "es_end": 10.83, "el_start": 11.83, "el_end": 16.31, "zh_start": 17.31, "zh_end": 20.07, "el_repeat_at": 17.19, "repeat_at": 20.95, "end": 21.07}, {"sent_idx": 1, "baked_pass": 1, "baked_passes": 1, "en": "That's amazing!", "fr": "C’est incroyable !", "es": "¡Qué increíble!", "el": "Απίστευτο!", "zh": "太神奇了！", "pinyin": "Tài shénqí le!", "start": 21.07, "en_end": 22.39, "fr_start": 23.39, "fr_end": 24.8, "es_start": 25.8, "es_end": 26.9, "el_start": 27.9, "el_end": 29.78, "zh_start": 30.78, "zh_end": 31.98, "el_repeat_at": 30.66, "repeat_at": 32.86, "end": 32.98}, {"sent_idx": 2, "baked_pass": 1, "baked_passes": 1, "en": "What happens if the spinal cord is injured?", "fr": "Qu’est-ce qui se passe si la moelle épinière est touchée ?", "es": "¿Qué pasa si se lesiona la médula espinal?", "el": "Τι γίνεται αν τραυματιστεί ο νωτιαίος μυελός;", "zh": "如果脊髓受伤了会怎么样？", "pinyin": "Rúguǒ jǐsuǐ shòushāng le huì zěnmeyàng?", "start": 32.98, "en_end": 35.27, "fr_start": 36.27, "fr_end": 39.13, "es_start": 40.13, "es_end": 42.75, "el_start": 4     return getActiveDay().batches;

  function dayHasMandarin(day) {
    if (!day) return false;
    if (typeof day.hasMandarin === "boolean") return day.hasMandarin;
    const firstCue = day.batches && day.batches[0] && day.batches[0].cues && day.batches[0].cues[0];
    return Boolean(firstCue && firstCue.zh && typeof firstCue.zh_start === "number");
  }

  function getBatchLanguages(day, batch) {
    if (batch && Array.isArray(batch.languages) && batch.languages.length) {
      return batch.languages;
    }
    return dayHasMandarin(day) ? ["en", "fr", "es", "el", "zh"] : ["en", "fr", "es", "el"];
  }

  function canSkipMandarinInBatch(day, batch) {
    const langs = getBatchLanguages(day, batch);
    return langs.includes("zh") && langs.some(l => l !== "en" && l !== "zh");
  }

  function canEnBeforeEachInBatch(day, batch) {
    const langs = getBatchLanguages(day, batch);
    const canSkipZh = canSkipMandarinInBatch(day, batch);
    const nonEnLangs = langs.filter(l => l !== "en" && !(l === "zh" && canSkipZh && skipZh.checked));
    return langs.includes("en") && nonEnLangs.length > 1;

  function getBatchStorageKey(day) {

  function parseRepeatSetting(val) {

  }

  function parseTransRepeatSetting(val) {
    const n = parseInt(val, 10);
    return Number.isInteger(n) && n >= 1 && n <= 5 ? n : 1;

  const savedRepeat = localStorage.getItem(REPEAT_STORAGE_KEY);

    showPinyin.disabled = !hasZh || zhSkipped;

    ["en", "fr", "es", "el", "zh"].forEach((lang) => {
      const present = langs.includes(lang);

    if (isExtraPausing) {
      playPauseBtn.textContent = `⏸ Pause (+${getExtraPauseSeconds()}s pause…)`;
      playPauseBtn.classList.add("playing");
    } else if (isUserPlaying && !audio.paused) {
      playPauseBtn.textContent = "⏸ Pause";
      playPauseBtn.classList.add("playing");
    } else {
      playPauseBtn.textContent = "▶ Play";
      playPauseBtn.classList.remove("playing");
    }
  }

  function clearExtraPause() {
    if (extraPauseTimer !== null) {
      clearTimeout(extraPauseTimer);
      extraPauseTimer = null;
    }
    if (isExtraPausing) {
      isExtraPausing = false;
      updatePlayPauseButton();
    }
  }

  function startExtraPause(seconds, batch, cue, activeSeg, promptTargetKey) {
    clearExtraPause();
    isExtraPausing = true;
    audio.pause();
    updatePlayPauseButton();
    counterEl.textContent = formatCounter(batch, cue, activeSeg, true, promptTargetKey) + ` · +${seconds}s pause`;
    extraPauseTimer = setTimeout(() => {
      extraPauseTimer = null;
      isExtraPausing = false;
      if (isUserPlaying) {
        applySpeed();
        audio.play().catch(() => {});
      }
      updatePlayPauseButton();
      updateDisplay();
    }, Math.round(seconds * 1000));
  }

  function updateMediaSession(day, batch) {
    if ("mediaSession" in navigator) {
      const canSkipZh = canSkipMandarinInBatch(day, batch);
      const activeLangs = getBatchLanguages(day, batch).filter(
        l => !(l === "zh" && canSkipZh && skipZh.checked)
      );
      let albumChain;
      if (enBeforeEach.checked && canEnBeforeEachInBatch(day, batch)) {
        const targets = activeLangs.filter(l => l !== "en");
        albumChain = targets.map(l => `EN → ${LANG_LABELS[l] || l.toUpperCase()}`).join(" · ");
      } else {
        albumChain = activeLangs.map(l => LANG_LABELS[l] || l.toUpperCase()).join(" → ");
      }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `Polyglot Drill · ${batch.label}`,
        artist: `${day.date} · Day ${day.dayNumber} (${batch.range})`,
        album: albumChain,
      });
    }
  }

  function renderDayOptions() {
    daySelect.innerHTML = "";
    days.forEach((day, idx) => {
      const opt = document.createElement("option");
      opt.value = String(idx);
      const isCurrent = day.id === DEFAULT_DAY_ID;
      opt.textContent = isCurrent
        ? `${day.date} · Day ${day.dayNumber} (Current)`
        : `${day.date} · Day ${day.dayNumber}`;
      daySelect.appendChild(opt);
    });
  }

  function renderTabs() {
    const batches = getActiveBatches();
    tabsEl.innerHTML = "";
    batches.forEach((batch, idx) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (idx === activeBatchIndex ? " active" : "");
      btn.innerHTML = `${batch.label}<span>${batch.range}</span>`;
      btn.onclick = () => selectBatch(idx, false);
      tabsEl.appendChild(btn);
    });
  }

  function resetSegmentTracking(segIdx) {
    activeSegIdx = segIdx;
    segPass = 1;
    pausedCurrentSegPass = false;
    pendingRepeatSegIdx = -1;
    playingEnPromptForSegIdx = -1;
    awaitingEnPromptSeek = false;
  }

  function resetRepeatTracking(cueIdx) {
    lockedCueIdx = cueIdx;
    playerPass = 1;
    completedCueIdx = -1;
    maxRevealedRank = 0;
    resetSegmentTracking(0);
  }

  function seekInternally(targetSeconds) {
    isInternalSeek = true;
    internalSeekTarget = targetSeconds;
    repeatCooldownUntil = performance.now() + 350;
    audio.currentTime = targetSeconds;
    setTimeout(() => { isInternalSeek = false; }, 150);
  }

  function formatBakedNote(day) {
    const parts = [];
    if (day.bakedRepeats > 1) parts.push(`${day.bakedRepeats}x set`);
    if (day.bakedTranslationRepeats > 1) parts.push(`${day.bakedTranslationRepeats}x trans`);
    return parts.length ? `(MP3 baked: ${parts.join(", ")})` : "";
  }

  function selectDay(dayIdx, isInitialLoad) {
    if (!isInitialLoad && dayIdx === activeDayIndex) return;
    clearExtraPause();
    isUserPlaying = false;
    activeDayIndex = dayIdx;

    const day = getActiveDay();
    daySelect.value = String(dayIdx);
    todayBtn.hidden = day.id === DEFAULT_DAY_ID;

    const historyTag = days.length > 1 ? ` · ${days.length}/${HISTORY_LIMIT} days` : "";
    headerMetaEl.textContent = day.headerMeta + historyTag;
    bakedNoteEl.textContent = formatBakedNote(day);

    const savedBatch = parseInt(localStorage.getItem(getBatchStorageKey(day)) || "0", 10);
    const initialBatchIdx =
      Number.isInteger(savedBatch) && savedBatch >= 0 && savedBatch < day.batches.length
        ? savedBatch
        : 0;
    selectBatch(initialBatchIdx, true);
  }

  function selectBatch(idx, forceReload) {
    if (!forceReload && idx === activeBatchIndex) return;
    clearExtraPause();
    isUserPlaying = false;
    activeBatchIndex = idx;

    const day = getActiveDay();
    const batches = day.batches;
    localStorage.setItem(getBatchStorageKey(day), String(idx));

    const batch = batches[activeBatchIndex];
    lastSentIdx = -1;
    resetRepeatTracking(0);
    applyBatchLanguageUI();
    renderTabs();
    updateMediaSession(day, batch);

    audio.pause();
    audio.src = batch.audioSrc;
    audio.load();
    applySpeed();
    updatePlayPauseButton();

    // Build clickable list of unique sentences (jumping to Pass 1 of each sentence)
    listEl.innerHTML = "";
    const uniqueSentences = [];
    const seenSent = new Set();
    batch.cues.forEach((cue, cueIdx) => {
      if (!seenSent.has(cue.sent_idx)) {
        seenSent.add(cue.sent_idx);
        uniqueSentences.push({ sentIdx: cue.sent_idx, firstCueIdx: cueIdx, en: cue.en });
      }
    });

    itemEls = uniqueSentences.map((entry) => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = `${entry.sentIdx + 1}. ${entry.en}`;
      div.onclick = () => {
        clearExtraPause();
        resetRepeatTracking(entry.firstCueIdx);
        const targetCue = batch.cues[entry.firstCueIdx];
        const jumpSec = typeof targetCue.en_start === "number"
          ? Math.max(targetCue.start, targetCue.en_start - 0.05)
          : targetCue.start + 0.01;
        seekInternally(jumpSec);
        isUserPlaying = true;
        applySpeed();
        audio.play();
        updatePlayPauseButton();
        updateDisplay();
      };
      listEl.appendChild(div);
      return div;
    });

    updateDisplay();
  }

  function getActiveSegments(cue) {
    const day = getActiveDay();
    const batch = getActiveBatches()[activeBatchIndex];
    const batchLangs = getBatchLanguages(day, batch);
    const hasZh = batchLangs.includes("zh") && typeof cue.zh_start === "number";
    const shouldSkipZh = canSkipMandarinInBatch(day, batch) && skipZh.checked;
    const includeZh = hasZh && !shouldSkipZh;
    let rawSegs;

    if (Array.isArray(cue.segments) && cue.segments.length) {
      rawSegs = cue.segments
        .filter(s => includeZh || s.key !== "zh")
        .map(s => ({
          key: s.key,
          start: s.start,
          end: s.end,
          prevEnd: typeof s.prev_end === "number" ? s.prev_end : cue.start,
          next: s.next,
          bakedPass: s.baked_pass || 1,
          bakedPasses: s.baked_passes || 1,
        }));
    } else {
      const enStart = typeof cue.en_start === "number" ? cue.en_start : cue.start;
      rawSegs = [
        { key: "en", start: enStart, end: cue.en_end, prevEnd: cue.start, next: batchLangs.includes("fr") ? cue.fr_start : cue.zh_start, bakedPass: 1, bakedPasses: 1 },
      ];
      if (batchLangs.includes("fr")) {
        rawSegs.push({ key: "fr", start: cue.fr_start, end: cue.fr_end, prevEnd: cue.en_end, next: cue.es_start, bakedPass: 1, bakedPasses: 1 });
      }
      if (batchLangs.includes("es")) {
        rawSegs.push({ key: "es", start: cue.es_start, end: cue.es_end, prevEnd: cue.fr_end, next: cue.el_start, bakedPass: 1, bakedPasses: 1 });
      }
      if (batchLangs.includes("el")) {
        rawSegs.push({ key: "el", start: cue.el_start, end: cue.el_end, prevEnd: cue.es_end, next: hasZh ? cue.zh_start : cue.end, bakedPass: 1, bakedPasses: 1 });
      }
      if (includeZh) {
        const prevKeyEnd = batchLangs.includes("el") ? cue.el_end : cue.en_end;
        rawSegs.push({ key: "zh", start: cue.zh_start, end: cue.zh_end, prevEnd: prevKeyEnd, next: cue.end, bakedPass: 1, bakedPasses: 1 });
      }
    }

    return rawSegs.map((s, idx) => {
      const isLast = idx === rawSegs.length - 1;
      const gapAfter = Math.max(0, s.next - s.end);
      const gapBefore = Math.max(0, s.start - s.prevEnd);
      const extraPauseAt = s.end + Math.min(0.12, gapAfter * 0.25);

      let repeatAt;
      if (isLast && !shouldSkipZh && typeof cue.repeat_at === "number") {
        repeatAt = cue.repeat_at;
      } else if (isLast && shouldSkipZh && typeof cue.el_repeat_at === "number") {
        repeatAt = cue.el_repeat_at;
      } else if (gapAfter >= 0.20) {
        repeatAt = s.end + Math.min(0.35, Math.max(0.05, gapAfter - 0.15));
      } else {
        repeatAt = Math.max(s.end, s.next - 0.05);
      }

      const lead = Math.min(0.45, gapBefore * 0.6);
      let seekBackTo = s.start - lead;
      if (gapBefore >= 0.55) {
        seekBackTo = Math.max(s.prevEnd + 0.40, seekBackTo);
      }
      seekBackTo = Math.max(cue.start + 0.01, seekBackTo);

      return {
        ...s,
        isLast,
        extraPauseAt,
        repeatAt,
        seekBackTo,
      };
    });
  }

  function findSegmentIndexAtTime(segs, t) {
    for (let i = 0; i < segs.length; i++) {
      if (t < segs[i].next) return i;
    }
    return segs.length - 1;
  }

  function formatCounter(batch, cue, activeSeg, showSegPass, promptTargetKey) {
    let text = `${batch.label} · Sentence ${cue.sent_idx + 1} of ${batch.sentenceCount}`;
    if (repeatTarget === Infinity) {
      text += ` · Looping`;
    } else if (repeatTarget > 1) {
      text += ` · Set ${Math.min(playerPass, repeatTarget)}/${repeatTarget}`;
    } else if (cue.baked_passes > 1) {
      text += ` · Set ${cue.baked_pass}/${cue.baked_passes}`;
    }
    if (promptTargetKey) {
      const nextBadge = LANG_LABELS[promptTargetKey] || promptTargetKey.toUpperCase();
      text += ` · EN → ${nextBadge}`;
    } else if (activeSeg && activeSeg.key !== "en" && showSegPass) {
      const badge = LANG_LABELS[activeSeg.key] || activeSeg.key.toUpperCase();
      if (transRepeatTarget > 1) {
        text += ` · ${badge} ${Math.min(segPass, transRepeatTarget)}/${transRepeatTarget}`;
      } else if (activeSeg.bakedPasses > 1) {
        text += ` · ${badge} ${activeSeg.bakedPass}/${activeSeg.bakedPasses}`;
      }
    }
    return text;
  }

  function updateDisplay() {
    const batch = getActiveBatches()[activeBatchIndex];
    const cues = batch.cues;
    if (!cues || !cues.length) return;

    const nowMs = performance.now();
    const t = audio.currentTime;
    let idx = cues.findIndex(c => t >= c.start && t < c.end);
    if (idx === -1) {
      idx = t >= cues[cues.length - 1].end ? cues.length - 1 : 0;
    }

    if (isExtraPausing) {
      return;
    }

    const activeDay = getActiveDay();
    const batchLangs = getBatchLanguages(activeDay, batch);
    const shouldSkipZh = canSkipMandarinInBatch(activeDay, batch) && skipZh.checked;
    const isEnBeforeEachActive = enBeforeEach.checked && canEnBeforeEachInBatch(activeDay, batch);

    // Handle active playback: extra pauses, per-translation repeats (excl. EN), skip Mandarin, and set repeats
    if (!audio.paused && nowMs >= repeatCooldownUntil) {
      if (lockedCueIdx === -1) {
        // User just finished a manual scrub
        if (shouldSkipZh && typeof cues[idx].zh_start === "number" && t >= cues[idx].zh_start) {
          const nextIdx = (idx + 1) % cues.length;
          resetRepeatTracking(nextIdx);
          seekInternally(cues[nextIdx].start + 0.01);
          return;
        }
        resetRepeatTracking(idx);
        const initSegs = getActiveSegments(cues[idx]);
        const sIdx = findSegmentIndexAtTime(initSegs, t);
        activeSegIdx = sIdx;
        segPass = 1;
        pausedCurrentSegPass = typeof initSegs[sIdx].end === "number" && t >= initSegs[sIdx].extraPauseAt;
        maxRevealedRank = LANG_RANK[initSegs[sIdx].key] || 0;
      }

      const lockedCue = cues[lockedCueIdx];
      const lockedSegs = getActiveSegments(lockedCue);
      if (activeSegIdx < 0 || activeSegIdx >= lockedSegs.length) {
        resetSegmentTracking(findSegmentIndexAtTime(lockedSegs, t));
      }

      // Handle wrap-around on a 1-sentence batch
      if (cues.length === 1 && completedCueIdx === 0 && t < lockedCue.start + 0.4) {
        resetRepeatTracking(0);
      }

      const needsMoreSetPasses = repeatTarget === Infinity || playerPass < repeatTarget;

      if (idx === lockedCueIdx) {
        const extraSec = getExtraPauseSeconds();

        // Special state: replaying English once as a live prompt before the next target language
        if (playingEnPromptForSegIdx >= 0) {
          const enSeg = lockedSegs[0];
          if (playingEnPromptForSegIdx >= lockedSegs.length || !enSeg || enSeg.key !== "en") {
            // Target segment vanished (e.g., Skip Mandarin toggled on while prompting for ZH)
            if (repeatTarget > 1 && needsMoreSetPasses) {
              if (repeatTarget !== Infinity) playerPass += 1;
              maxRevealedRank = 0;
              resetSegmentTracking(0);
              seekInternally(lockedCue.start + 0.01);
              counterEl.textContent = formatCounter(batch, lockedCue, lockedSegs[0], false);
              return;
            } else {
              const nextIdx = (lockedCueIdx + 1) % cues.length;
              resetRepeatTracking(nextIdx);
              seekInternally(cues[nextIdx].start + 0.01);
              counterEl.textContent = formatCounter(batch, cues[nextIdx], null, false);
              return;
            }
          }

          if (awaitingEnPromptSeek) {
            if (t < enSeg.repeatAt) {
              awaitingEnPromptSeek = false;
            } else {
              return;
            }
          }

          const targetSegIdx = playingEnPromptForSegIdx;
          const targetSeg = lockedSegs[targetSegIdx];

          if (
            extraSec > 0 &&
            !pausedCurrentSegPass &&
            typeof enSeg.end === "number" &&
            t >= enSeg.extraPauseAt &&
            t < enSeg.next - 0.04
          ) {
            pausedCurrentSegPass = true;
            startExtraPause(extraSec, batch, lockedCue, enSeg, targetSeg.key);
            return;
          }

          if (t >= enSeg.repeatAt) {
            resetSegmentTracking(targetSegIdx);
            pendingRepeatSegIdx = targetSegIdx;
            seekInternally(targetSeg.seekBackTo);
            counterEl.textContent = formatCounter(batch, lockedCue, targetSeg, true);
            return;
          }
        } else {
          const curSeg = lockedSegs[activeSegIdx];
          if (pendingRepeatSegIdx === activeSegIdx && t >= curSeg.start) {
            pendingRepeatSegIdx = -1;
          }

          const canRepeatTrans = curSeg.key !== "en" && transRepeatTarget > 1;
          const needsMoreTransPasses = canRepeatTrans && segPass < transRepeatTarget;

          // 1. Extra pause right after current language clip finishes (applies to every translation repetition too)
          if (
            extraSec > 0 &&
            !pausedCurrentSegPass &&
            typeof curSeg.end === "number" &&
            t >= curSeg.extraPauseAt &&
            t < curSeg.next - 0.04
          ) {
            pausedCurrentSegPass = true;
            startExtraPause(extraSec, batch, lockedCue, curSeg);
            return;
          }

          // 2. End of current language clip: repeat translation, replay EN prompt before next language, advance, or finish pass
          if (t >= curSeg.repeatAt) {
            if (needsMoreTransPasses) {
              segPass += 1;
              pausedCurrentSegPass = false;
              pendingRepeatSegIdx = activeSegIdx;
              seekInternally(curSeg.seekBackTo);
              counterEl.textContent = formatCounter(batch, lockedCue, curSeg, true);
              return;
            } else if (activeSegIdx < lockedSegs.length - 1) {
              const nextSegIdx = activeSegIdx + 1;
              const nextSeg = lockedSegs[nextSegIdx];
              const enSeg = lockedSegs[0];
              if (
                isEnBeforeEachActive &&
                enSeg &&
                enSeg.key === "en" &&
                curSeg.key !== "en" &&
                nextSeg.key !== "en" &&
                nextSeg.key !== curSeg.key
              ) {
                playingEnPromptForSegIdx = nextSegIdx;
                awaitingEnPromptSeek = true;
                pausedCurrentSegPass = false;
                pendingRepeatSegIdx = -1;
                seekInternally(enSeg.seekBackTo);
                counterEl.textContent = formatCounter(batch, lockedCue, enSeg, false, nextSeg.key);
                return;
              }
              // Finished this language clip; advance tracking to the next language in the sentence
              resetSegmentTracking(nextSegIdx);
            } else {
              // Finished the last language clip of this sentence pass
              if (repeatTarget > 1 && needsMoreSetPasses) {
                if (repeatTarget !== Infinity) playerPass += 1;
                maxRevealedRank = 0;
                resetSegmentTracking(0);
                seekInternally(lockedCue.start + 0.01);
                counterEl.textContent = formatCounter(batch, lockedCue, lockedSegs[0], false);
                return;
              } else if (shouldSkipZh) {
                const nextIdx = (lockedCueIdx + 1) % cues.length;
                resetRepeatTracking(nextIdx);
                seekInternally(cues[nextIdx].start + 0.01);
                counterEl.textContent = formatCounter(batch, cues[nextIdx], null, false);
                return;
              } else {
                completedCueIdx = lockedCueIdx;
              }
            }
          }
        }
      } else {
        // Audio crossed into next cue before timer caught the trailing silence
        const lastSegIdx = lockedSegs.length - 1;
        const lastSeg = lockedSegs[lastSegIdx];
        const needsLastTrans =
          activeSegIdx === lastSegIdx &&
          lastSeg.key !== "en" &&
          transRepeatTarget > 1 &&
          segPass < transRepeatTarget;

        if (needsLastTrans) {
          segPass += 1;
          pausedCurrentSegPass = false;
          pendingRepeatSegIdx = lastSegIdx;
          seekInternally(lastSeg.seekBackTo);
          counterEl.textContent = formatCounter(batch, lockedCue, lastSeg, true);
          return;
        } else if (repeatTarget > 1 && completedCueIdx !== lockedCueIdx && needsMoreSetPasses) {
          if (repeatTarget !== Infinity) playerPass += 1;
          maxRevealedRank = 0;
          resetSegmentTracking(0);
          seekInternally(lockedCue.start + 0.01);
          counterEl.textContent = formatCounter(batch, lockedCue, lockedSegs[0], false);
          return;
        } else {
          resetRepeatTracking(idx);
        }
      }
    } else if (audio.paused && repeatTarget === 1 && transRepeatTarget === 1 && lockedCueIdx !== idx) {
      resetRepeatTracking(idx);
    }

    const cue = cues[idx];
    const segs = getActiveSegments(cue);
    if (cue.sent_idx !== lastSentIdx) {
      if (lastSentIdx >= 0 && itemEls[lastSentIdx]) {
        itemEls[lastSentIdx].classList.remove("active");
      }
      if (itemEls[cue.sent_idx]) itemEls[cue.sent_idx].classList.add("active");
      texts.en.textContent = cue.en || "";
      texts.fr.textContent = cue.fr || "";
      texts.es.textContent = cue.es || "";
      texts.el.textContent = cue.el || "";
      texts.zh.textContent = cue.zh || "";
      texts.pinyin.textContent = cue.pinyin || "";
      lastSentIdx = cue.sent_idx;
    }

    // Determine which language is currently highlighted & active for display
    let speaking = "en";
    let displaySeg = segs[0] || null;
    let showSegPassInCounter = false;
    let promptTargetKey = "";

    if (idx === lockedCueIdx && playingEnPromptForSegIdx >= 0 && playingEnPromptForSegIdx < segs.length) {
      displaySeg = segs[0] || null;
      speaking = "en";
      showSegPassInCounter = false;
      promptTargetKey = segs[playingEnPromptForSegIdx].key;
    } else if (idx === lockedCueIdx && pendingRepeatSegIdx >= 0 && pendingRepeatSegIdx < segs.length) {
      displaySeg = segs[pendingRepeatSegIdx];
      speaking = displaySeg.key;
      showSegPassInCounter = true;
    } else {
      for (let i = segs.length - 1; i >= 0; i--) {
        if (t >= segs[i].start) {
          displaySeg = segs[i];
          speaking = segs[i].key;
          showSegPassInCounter = true;
          break;
        }
      }
    }

    if (idx === lockedCueIdx && displaySeg && !promptTargetKey) {
      const rank = LANG_RANK[displaySeg.key] || 0;
      if (t >= displaySeg.start && rank > maxRevealedRank) {
        maxRevealedRank = rank;
      }
    }

    counterEl.textContent = formatCounter(batch, cue, displaySeg, showSegPassInCounter, promptTargetKey);

    Object.entries(rows).forEach(([lang, el]) => {
      el.classList.toggle("speaking", lang === speaking);
    });

    const progressive = revealMode.checked;
    const revealedRank = idx === lockedCueIdx ? maxRevealedRank : (LANG_RANK[speaking] || 0);
    rows.fr.classList.toggle("hidden", batchLangs.includes("fr") && progressive && revealedRank < 1 && typeof cue.fr_start === "number" && t < cue.fr_start);
    rows.es.classList.toggle("hidden", batchLangs.includes("es") && progressive && revealedRank < 2 && typeof cue.es_start === "number" && t < cue.es_start);
    rows.el.classList.toggle("hidden", batchLangs.includes("el") && progressive && revealedRank < 3 && typeof cue.el_start === "number" && t < cue.el_start);
    rows.zh.classList.toggle(
      "hidden",
      batchLangs.includes("zh") && progressive && revealedRank < 4 && typeof cue.zh_start === "number" && t < cue.zh_start
    );
  }

  daySelect.onchange = () => {
    const idx = parseInt(daySelect.value, 10);
    if (Number.isInteger(idx) && idx >= 0 && idx < days.length) {
      selectDay(idx, false);
    }
  };

  todayBtn.onclick = () => {
    const defaultIdx = days.findIndex(d => d.id === DEFAULT_DAY_ID);
    selectDay(defaultIdx >= 0 ? defaultIdx : 0, false);
  };

  playPauseBtn.onclick = () => {
    if (isUserPlaying || isExtraPausing || !audio.paused) {
      isUserPlaying = false;
      clearExtraPause();
      audio.pause();
      updatePlayPauseButton();
      updateDisplay();
    } else {
      isUserPlaying = true;
      applySpeed();
      audio.play();
      updatePlayPauseButton();
    }
  };

  repeatSelect.onchange = () => {
    repeatTarget = parseRepeatSetting(repeatSelect.value);
    localStorage.setItem(REPEAT_STORAGE_KEY, repeatSelect.value);
    const cues = getActiveBatches()[activeBatchIndex].cues;
    const t = audio.currentTime;
    const idx = cues.findIndex(c => t >= c.start && t < c.end);
    const curCueIdx = idx >= 0 ? idx : 0;
    lockedCueIdx = curCueIdx;
    playerPass = 1;
    completedCueIdx = -1;
    updateDisplay();
  };

  transRepeatSelect.onchange = () => {
    transRepeatTarget = parseTransRepeatSetting(transRepeatSelect.value);
    localStorage.setItem(TRANS_REPEAT_STORAGE_KEY, transRepeatSelect.value);
    const cues = getActiveBatches()[activeBatchIndex].cues;
    const t = audio.currentTime;
    const idx = cues.findIndex(c => t >= c.start && t < c.end);
    const curCueIdx = idx >= 0 ? idx : 0;
    const segs = getActiveSegments(cues[curCueIdx]);
    const sIdx = findSegmentIndexAtTime(segs, t);
    lockedCueIdx = curCueIdx;
    activeSegIdx = sIdx;
    segPass = 1;
    pendingRepeatSegIdx = -1;
    updateDisplay();
  };

  extraPauseToggle.onchange = () => {
    localStorage.setItem(EXTRA_PAUSE_ON_KEY, String(extraPauseToggle.checked));
    applyExtraPauseUI();
    if (!extraPauseToggle.checked && isExtraPausing) {
      clearExtraPause();
      if (isUserPlaying) {
        applySpeed();
        audio.play().catch(() => {});
      }
    }
    updateDisplay();
  };

  extraPauseSecSelect.onchange = () => {
    localStorage.setItem(EXTRA_PAUSE_SEC_KEY, extraPauseSecSelect.value);
    updatePlayPauseButton();
  };

  enBeforeEach.onchange = () => {
    localStorage.setItem(EN_BEFORE_EACH_STORAGE_KEY, String(enBeforeEach.checked));
    const curDay = getActiveDay();
    const curBatch = getActiveBatches()[activeBatchIndex];
    updateMediaSession(curDay, curBatch);
    if (!enBeforeEach.checked && playingEnPromptForSegIdx >= 0 && lockedCueIdx >= 0 && curBatch.cues[lockedCueIdx]) {
      const lockedCue = curBatch.cues[lockedCueIdx];
      const segs = getActiveSegments(lockedCue);
      const targetSegIdx = Math.min(playingEnPromptForSegIdx, segs.length - 1);
      const targetSeg = segs[targetSegIdx];
      clearExtraPause();
      resetSegmentTracking(targetSegIdx);
      if (targetSeg) {
        pendingRepeatSegIdx = targetSegIdx;
        seekInternally(targetSeg.seekBackTo);
      }
      if (isUserPlaying && audio.paused) {
        applySpeed();
        audio.play().catch(() => {});
      }
    }
    updateDisplay();
  };

  skipZh.onchange = () => {
    localStorage.setItem(SKIP_ZH_STORAGE_KEY, String(skipZh.checked));
    const curDay = getActiveDay();
    const curBatch = getActiveBatches()[activeBatchIndex];
    applyBatchLanguageUI();
    updateMediaSession(curDay, curBatch);
    const cues = curBatch.cues;
    const t = audio.currentTime;
    const idx = cues.findIndex(c => t >= c.start && t < c.end);
    const wasPromptingForZh =
      canSkipMandarinInBatch(curDay, curBatch) &&
      skipZh.checked &&
      playingEnPromptForSegIdx >= 0 &&
      idx >= 0 &&
      playingEnPromptForSegIdx >= getActiveSegments(cues[idx]).length;
    // If user turned on Skip Mandarin while inside Mandarin (or prompting EN -> ZH), handle cleanly
    if (
      canSkipMandarinInBatch(curDay, curBatch) &&
      skipZh.checked &&
      idx >= 0 &&
      (wasPromptingForZh || (typeof cues[idx].zh_start === "number" && t >= cues[idx].zh_start))
    ) {
      if (!audio.paused || isExtraPausing) {
        clearExtraPause();
        const needsMorePasses = repeatTarget === Infinity || playerPass < repeatTarget;
        if (repeatTarget > 1 && needsMorePasses) {
          if (repeatTarget !== Infinity) playerPass += 1;
          maxRevealedRank = 0;
          resetSegmentTracking(0);
          seekInternally(cues[idx].start + 0.01);
        } else {
          const nextIdx = (idx + 1) % cues.length;
          resetRepeatTracking(nextIdx);
          seekInternally(cues[nextIdx].start + 0.01);
        }
        if (isUserPlaying && audio.paused) {
          applySpeed();
          audio.play().catch(() => {});
        }
      } else {
        // Paused on Mandarin: clear lock so resuming immediately advances past Mandarin
        lockedCueIdx = -1;
        completedCueIdx = -1;
        resetSegmentTracking(-1);
      }
    }
    updateDisplay();
  };

  audio.addEventListener("seeking", () => {
    if (!isInternalSeek) {
      clearExtraPause();
      lockedCueIdx = -1;
      playerPass = 1;
      completedCueIdx = -1;
      maxRevealedRank = 0;
      resetSegmentTracking(-1);
    }
  });

  speedSelect.onchange = applySpeed;
  audio.addEventListener("loadedmetadata", applySpeed);
  audio.addEventListener("play", () => {
    clearExtraPause();
    isUserPlaying = true;
    applySpeed();
    updatePlayPauseButton();
  });
  audio.addEventListener("pause", () => {
    if (!isExtraPausing) {
      isUserPlaying = false;
      updatePlayPauseButton();
    }
  });
  showPinyin.onchange = () => {
    localStorage.setItem(PINYIN_STORAGE_KEY, String(showPinyin.checked));
    applyPinyinVisibility();
  };
  revealMode.onchange = updateDisplay;
  audio.addEventListener("seeked", () => {
    if (internalSeekTarget !== null && Math.abs(audio.currentTime - internalSeekTarget) < 0.5) {
      repeatCooldownUntil = 0;
      internalSeekTarget = null;
      if (awaitingEnPromptSeek) {
        awaitingEnPromptSeek = false;
      }
    }
    updateDisplay();
  });
  audio.addEventListener("timeupdate", updateDisplay);
  setInterval(updateDisplay, 40);

  renderDayOptions();
  // Always default to the current day on load
  const defaultDayIdx = days.findIndex(d => d.id === DEFAULT_DAY_ID);
  selectDay(defaultDayIdx >= 0 ? defaultDayIdx : 0, true);
</script>
</body>
